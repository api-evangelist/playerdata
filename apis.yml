aid: playerdata
name: PlayerData
description: >-
  PlayerData provides GPS sports performance tracking technology for athletes and
  teams — FIFA Quality Certified EDGE wearable trackers, a GPS-enabled Connected
  Ball, and indoor IMU / local-positioning systems. Its platform captures distance,
  speed, sprints, acceleration/deceleration and workload, and exposes a GraphQL API
  secured with OAuth 2.0 covering clubs, athletes, sessions, devices, metrics and
  reports, plus real-time GraphQL subscription events. Official Python (playerdatapy)
  and R (playerdatar) client libraries wrap the API. PlayerData is a Techstars
  portfolio company.
